apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mindcircuit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sivakalyanb/mindcircuit13-main.git
    targetRevision: main
    path: deploymentfiles
  destination:
    server: https://kubernetes.default.svc
    namespace: mindcircuit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
